<div class="flex gap-2 flex-col h-full items-center justify-center text-center">
    <div>
        <p class="inline">Bem vindo ao </p>
        <h1 class="text-nowrap inline overline font-bold text-2xl">Bilhete Mixuruca</h1>
    </div>
    <form class="flex flex-col p-2 gap-8 w-full max-w-2xl" (ngSubmit)="onSubmit()" #form="ngForm">
        <div class="flex flex-col gap-3">
            <label for="estados" class="fieldset-legend text-base dark:text-[#E9C7FF] text-[#8e06e8]">Escolha o estado a
                seguir</label>
            <select class="select appearance-none outline-0 dark:text-white text-black w-full" required name="estados"
                id="estados" [(ngModel)]="estado">
                <option value="" disabled selected hidden>Selecione um estado</option>
                @for (item of estados(); track $index) {
                <option [ngValue]="item.uf">{{item.name}}</option>
                }
            </select>
            <label for="cidades" class="fieldset-legend text-base dark:text-[#E9C7FF] text-[#8e06e8]">Escolha a
                cidade</label>
            <select class="select appearance-none outline-0 dark:text-white text-black w-full" required name="cidades"
                id="cidades" [(ngModel)]="cidade">
                <option value="" disabled selected hidden>Selecione uma cidade</option>
                @for (item of estados(); track $index) {
                @if (item.uf === estado) {
                @for (elemento of item.cities; track $index) {
                <option [ngValue]="elemento.id">{{elemento.name}}</option>
                }
                }
                }
            </select>
        </div>
        <button class="btn btn-primary rounded-2xl h-14 font-bold text-xl" [disabled]="form.invalid"
            type="submit">Buscar</button>
    </form>
</div>
